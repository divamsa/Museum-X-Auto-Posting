<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusePost | 博物館・美術館 広報支援</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        gold: '#C5A059',
                        navy: '#1A1C2C',
                        museum: '#1A1C2C',
                        accent: '#C5A059',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Serif JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background-color: #F9F7F2; color: #1A1C2C; margin: 0; }
        #root:empty::before {
            content: "システムを構築中...";
            display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: serif; font-weight: bold; color: #C5A059; letter-spacing: 0.1em;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        window.addEventListener('error', function(e) {
            if (e.message.includes('import') || e.message.includes('Fetch')) {
                const root = document.getElementById('root');
                root.innerHTML = `<div style="padding: 40px; font-family: sans-serif; text-align: center;">
                    <h2 style="color: #b91c1c;">🚀 起動の準備をしています</h2>
                    <p>依存関係の読み込みに時間がかかっています。3〜5秒待ってから「再読み込み」を押してください。</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #1A1C2C; color: white; border: none; border-radius: 8px; cursor: pointer;">再読み込み</button>
                    <div style="margin-top: 30px; font-size: 11px; color: #999; text-align: left; background: #eee; padding: 15px; border-radius: 5px;">
                        Error: ${e.message}<br>File: ${e.filename}
                    </div>
                </div>`;
            }
        });
    </script>
</body>
</html>
