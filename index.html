<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusePost | 博物館・美術館 広報支援システム</title>
    
    <!-- Security & Env Shim -->
    <script>
        // process.env.API_KEYへのアクセスによるクラッシュを防止
        window.process = { env: { API_KEY: "" } };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- UI Framework (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        gold: '#C5A059',
                        navy: '#1A1C2C',
                        museum: '#1A1C2C',
                        accent: '#C5A059',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Serif JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9F7F2; color: #1A1C2C; margin: 0; }
        #root:empty::before {
            content: "🏛️ 博物館システムを起動中...";
            display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: serif; font-weight: bold; color: #C5A059; letter-spacing: 0.1em;
            background: #F9F7F2;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
        }
    </style>

    <!-- 
        Import Map: 
        バージョンの混在を防ぐため、すべて 19.0.0 に統一します。
        これがズレると React Error #321 (Invalid hook call) が発生します。
    -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- 
      Modern ESM Runner (GitHub Pages Ready):
      直接 index.tsx を src に指定せず、esm.sh/run を介して読み込みます。
      これにより GitHub Pages が TSX を text/plain として返しても、
      サービスワーカーが正しく JS としてトランスパイルします。
    -->
    <script type="module">
      import { run } from 'https://esm.sh/run';
      // .tsx の拡張子を明示し、相対パスで実行
      run('./index.tsx').catch(err => {
        console.error("Runner Error:", err);
        document.getElementById('root').innerHTML = '<div style="padding:50px; text-align:center;">システム起動に失敗しました。再読み込みしてください。</div>';
      });
    </script>

    <!-- エラー診断スクリプト -->
    <script>
        window.addEventListener('error', function(e) {
            // MIME type エラー (octet-stream) が出た場合のユーザー通知
            if (e.message.includes('MIME type') || e.message.includes('module script')) {
                const root = document.getElementById('root');
                root.innerHTML = `
                <div style="padding: 40px; font-family: sans-serif; text-align: center; background: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <h2 style="color: #d63384; font-size: 20px; font-weight: 800;">🚀 互換性エラーを検知しました</h2>
                    <p style="color: #666; margin: 20px 0; max-width: 400px; line-height: 1.6;">
                        ブラウザがスクリプトを正しく認識できていません。GitHubのデプロイが完了するまで数秒待ってから、下のボタンを押してください。
                    </p>
                    <button onclick="location.reload()" style="padding: 12px 30px; background: #1A1C2C; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;">
                        システムを再起動する
                    </button>
                </div>`;
            }
        });
    </script>
</body>
</html>
