<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusePost | 博物館・美術館 広報支援システム</title>
    
    <!-- Security & Env Shim -->
    <script>
        // process.envへのアクセスによるクラッシュを防止
        window.process = { env: { API_KEY: "" } };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- UI Framework (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        gold: '#C5A059',
                        navy: '#1A1C2C',
                        museum: '#1A1C2C',
                        accent: '#C5A059',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Serif JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9F7F2; color: #1A1C2C; margin: 0; }
        #root:empty::before {
            content: "🏛️ 博物館システムを起動中...";
            display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: serif; font-weight: bold; color: #C5A059; letter-spacing: 0.1em;
            background: #F9F7F2;
        }
    </style>

    <!-- 
        Import Map: 
        バージョンの不整合（19.0.0 vs 19.2.3）を解消し、
        完全に一つのバージョンに統一します。
    -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- esm.sh/run は最新の仕様に基づき、サイドエフェクトとして読み込みます -->
    <script type="module" src="https://esm.sh/run"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 
      type="text/tsx" として記述することで、
      esm.sh/run の Service Worker が確実に介入してトランスパイルを行います。
    -->
    <script type="text/tsx">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import App from './App.tsx';

      const container = document.getElementById('root');
      if (container) {
          const root = createRoot(container);
          root.render(
              <React.StrictMode>
                  <App />
              </React.StrictMode>
          );
          console.log("🏛️ MusePost: App Rendered Successfully.");
      }
    </script>

    <!-- タイムアウト診断（30秒経っても起動しない場合） -->
    <script>
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `
                <div style="padding: 40px; font-family: sans-serif; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #F9F7F2;">
                    <h2 style="color: #1A1C2C; font-size: 24px; font-family: serif;">🏛️ 起動に時間がかかっています</h2>
                    <p style="color: #666; margin: 20px 0; max-width: 400px; line-height: 1.6;">
                        初めての起動や更新直後は、AIエンジンの準備に時間がかかることがあります。<br>
                        数秒待ってから「再読み込み」をお試しください。
                    </p>
                    <button onclick="location.reload()" style="padding: 12px 30px; background: #C5A059; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(197,160,89,0.2);">
                        システムを再起動する
                    </button>
                </div>`;
            }
        }, 15000);
    </script>
</body>
</html>
