<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusePost | 博物館・美術館 広報支援システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        gold: '#C5A059',
                        navy: '#1A1C2C',
                        museum: '#1A1C2C',
                        accent: '#C5A059',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Serif JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background-color: #F9F7F2; color: #1A1C2C; margin: 0; overflow-x: hidden; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
        }
        .curator-shadow {
            box-shadow: 0 20px 50px -12px rgba(26, 28, 44, 0.1);
        }
        #root:empty::before {
            content: "Initializing MusePost System...";
            display: flex; justify-content: center; align-items: center; height: 100vh;
            color: #C5A059; font-weight: bold; font-family: serif; letter-spacing: 0.1em;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        window.onerror = function(msg, url, line) {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `<div style="padding: 50px; text-align: center; font-family: sans-serif;">
                    <h2 style="color: #b91c1c;">システム起動エラー</h2>
                    <p>JavaScriptの読み込みに失敗しました。ブラウザを更新してください。</p>
                    <code style="display: block; margin-top: 20px; color: #666;">${msg}</code>
                </div>`;
            }
        };
    </script>
</body>
</html>
